apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: observability-demo
  namespace: observability-demo
  labels:
    alertmanager: kube-prometheus-stack

spec:
  route:
    receiver: discord
    groupBy:
      - alertname
      - severity
    groupWait: 10s
    groupInterval: 1m
    repeatInterval: 4h

    matchers:
      - name: severity
        value: warning
        matchType: "="

  receivers:
    - name: discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: url
          sendResolved: true