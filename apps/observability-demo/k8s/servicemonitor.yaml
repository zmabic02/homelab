apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: observability-demo
  namespace: observability-demo
  labels:
    release: kube-prometheus-stack

spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: observability-demo

  endpoints:
    - port: http
      path: /metrics
      interval: 15s