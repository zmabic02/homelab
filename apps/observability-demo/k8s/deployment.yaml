apiVersion: apps/v1
kind: Deployment
metadata:
  name: observability-demo
  namespace: observability-demo
  labels:
    app.kubernetes.io/name: observability-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: observability-demo

  template:
    metadata:
      labels:
        app.kubernetes.io/name: observability-demo

    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: observability-demo
          image: ghcr.io/zmabic02/homelab-observability-demo:latest

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL