apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrule.yaml
  - alertmanagerconfig.yaml

generators:
  - ksops-generator.yaml

configMapGenerator:
  - name: observability-demo-dashboard
    namespace: observability-demo
    files:
      - observability-demo.json=dashboard.json
    options:
      labels:
        grafana_dashboard: "1"