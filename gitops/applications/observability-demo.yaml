apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/zmabic02/homelab.git
    targetRevision: main
    path: apps/observability-demo/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: observability-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
